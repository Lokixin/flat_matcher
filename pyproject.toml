[project]
name = "flat-matcher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lokixin", email = "dimasavilamartinez@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.6",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[project.scripts]
flat-matcher = "flat_matcher:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "isort>=9.0.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B"]

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]
known_first_party = ["flat_matcher"]
skip = [".venv", ".git", ".mypy_cache", ".ruff_cache", ".pytest_cache"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
files = ["src", "tests"]
disallow_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
